  - main [ref=f8e6]:
    - region [ref=f8e7]:
      - heading "使い方・よくある質問" [level=1] [ref=f8e8]
      - paragraph [ref=f8e9]: 管理表の取込や、社員・端末・クラウドサービスの管理方法を確認できます。
      - paragraph [ref=f8e10]:
        - link "FAQで解決しない場合はお問い合わせ" [ref=f8e11] [cursor=pointer]:
          - /url: http://127.0.0.1:8007/support
      - paragraph [ref=f8e12]:
        - text: メールでのお問い合わせ：
        - link "support@kimegami.jp" [ref=f8e13] [cursor=pointer]:
          - /url: mailto:support@kimegami.jp
      - navigation "ヘルプ内の目次" [ref=f8e14]:
        - list [ref=f8e15]:
          - listitem [ref=f8e16]:
            - link "初めて使う" [ref=f8e17] [cursor=pointer]:
              - /url: "#help-start-title"
          - listitem [ref=f8e18]:
            - link "Excelを取り込む" [ref=f8e19] [cursor=pointer]:
              - /url: "#help-excel-csv-title"
          - listitem [ref=f8e20]:
