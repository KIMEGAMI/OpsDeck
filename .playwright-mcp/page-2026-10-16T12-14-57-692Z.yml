              - cell "無料" [ref=f19e79]
              - cell "社員20名・端末50台・クラウドサービス10件・管理者1名" [ref=f19e80]
              - cell [ref=f19e81]:
                - list [ref=f19e82]:
                  - listitem [ref=f19e83]: CSV/TXTの実データ取込（登録上限まで）
