      - region [ref=f19e25]:
        - heading "初めて使うとき" [level=2] [ref=f19e26]
        - list [ref=f19e27]:
          - listitem [ref=f19e28]:
            - link "導入チェックリスト" [ref=f19e29] [cursor=pointer]:
              - /url: http://localhost:8007/onboarding
            - text: から、組織設定と必要な初期登録を順番に進めます。
          - listitem [ref=f19e30]:
            - link "データ取込" [ref=f19e31] [cursor=pointer]:
              - /url: http://localhost:8007/imports/create
            - text: を開き、社員・端末などのサンプルプレビューで、必要な列を確認します。
          - listitem [ref=f19e32]: 実際のデータを使うときは、元のExcelを残したままコピーを作ります。CSVは表の内容を保存するファイル形式です。コピーから必要なシートをCSV、または対応プランのXLSXとして別名保存します。
          - listitem [ref=f19e33]: 取込前の確認画面で、列の対応と「新規・更新・確認待ち・エラー」を確認します。確認画面を見るだけでは業務データは登録・更新されません。無料プラン（Free）でもCSV/TXTから登録でき、社員・資産・SaaSの登録数は各上限までです。XLSXやGoogle Sheetsなどは有料プラン（Premium）の機能です。
        - paragraph [ref=f19e34]: サンプルCSVは実データではありません。サンプル行を「データ取込」すると会社の情報として登録されるため、動作確認には「サンプルプレビュー」を使ってください。
      - region [ref=f19e35]:
        - heading "Excelの表をCSVにして取り込む" [level=2] [ref=f19e36]
        - list [ref=f19e37]:
          - listitem [ref=f19e38]: 元のExcelファイルは残します。コピーを作り、そのコピーを開きます。
          - listitem [ref=f19e39]: コピーの中で、取り込みたいシート（例：社員名簿）を選びます。
          - listitem [ref=f19e40]: 「ファイル」から「名前を付けて保存」または「コピーを保存」を選び、元とは別の名前と場所を指定します。
          - listitem [ref=f19e41]: 保存形式に「CSV UTF-8（コンマ区切り）」があれば選びます。ない場合は「CSV（コンマ区切り）」を選びます。表示名はExcelの版によって異なります。
          - listitem [ref=f19e42]: 「現在のシートだけが保存される」という確認が出たら、選んだシートが正しいことを確認して続けます。CSVには書式や数式ではなく、セルに表示されている値が保存されます。
          - listitem [ref=f19e43]: OpsDeckで保存したCSVを選び、「内容を確認する」を押します。列や新規・更新・エラーを確認し、問題がなければ取込を実行します。
        - paragraph [ref=f19e44]: 複数シートを取り込む場合は、CSVではシートごとに保存します。PremiumではXLSXファイルを選び、取り込むシートを画面で指定できます。
        - paragraph [ref=f19e45]:
          - link "MicrosoftのCSV保存手順" [ref=f19e46] [cursor=pointer]:
            - /url: https://support.microsoft.com/en-us/excel/save-a-workbook-to-text-format-txt-or-csv
      - region [ref=f19e47]:
        - heading "費用削減額の見方" [level=2] [ref=f19e48]
        - paragraph [ref=f19e49]: OpsDeckは登録された契約・クラウドサービス・端末などの情報から、月の費用や見直し候補の概算を表示します。概算は実際の削減額ではなく、契約の解約やライセンス停止も自動では行いません。
        - paragraph [ref=f19e50]:
          - text: 実際に削減できた金額は、担当者が根拠を確認して記録します。詳しくは
          - link "コストダッシュボード" [ref=f19e51] [cursor=pointer]:
            - /url: http://localhost:8007/costs
          - text: を確認してください。
      - region [ref=f19e52]:
        - heading "困ったとき" [level=2] [ref=f19e53]
        - paragraph [ref=f19e54]: 問題に近い項目を選ぶと、確認する順番が表示されます。
        - list [ref=f19e55]:
          - listitem [ref=f19e56]:
            - link "Excelなどの取込で困ったとき" [ref=f19e57] [cursor=pointer]:
