      - heading "使い方・よくある質問" [level=1] [ref=f19e7]
      - paragraph [ref=f19e8]: 管理表の取込や、社員・端末・クラウドサービスの管理方法を確認できます。
      - paragraph [ref=f19e9]:
        - link "FAQで解決しない場合はお問い合わせ" [ref=f19e10] [cursor=pointer]:
          - /url: http://localhost:8007/support
      - paragraph [ref=f19e11]:
        - text: メールでのお問い合わせ：
        - link "support@kimegami.jp" [ref=f19e12] [cursor=pointer]:
          - /url: mailto:support@kimegami.jp
      - navigation "ヘルプ内の目次" [ref=f19e13]:
        - list [ref=f19e14]:
          - listitem [ref=f19e15]:
            - link "初めて使う" [ref=f19e16] [cursor=pointer]:
              - /url: "#help-start-title"
          - listitem [ref=f19e17]:
            - link "Excelを取り込む" [ref=f19e18] [cursor=pointer]:
              - /url: "#help-excel-csv-title"
          - listitem [ref=f19e19]:
            - link "費用削減を見る" [ref=f19e20] [cursor=pointer]:
              - /url: "#help-savings-title"
          - listitem [ref=f19e21]:
            - link "困ったとき" [ref=f19e22] [cursor=pointer]:
              - /url: "#help-recovery-title"
