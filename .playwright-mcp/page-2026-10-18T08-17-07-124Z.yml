        - generic [ref=f2e15]:
          - paragraph [ref=f2e16]: Excel台帳から、社内ITの運用とコストを見える化
          - heading "誰が何を使い、いつ更新するかをひと目で。" [level=1] [ref=f2e17]
          - paragraph [ref=f2e18]: 社員・端末・クラウドサービス・契約をまとめて管理。更新漏れや利用者のいないサービスを見つけ、登録した情報と会社ごとの条件から年間の見直し候補額を確認できます。
