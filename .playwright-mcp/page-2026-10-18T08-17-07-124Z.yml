            - link "デモ画面を見る（登録不要）" [ref=f2e22] [cursor=pointer]:
              - /url: http://127.0.0.1:8007/demo
        - complementary "OpsDeckでできること" [ref=f2e23]:
          - heading "OpsDeckでできること" [level=2] [ref=f2e24]
          - list [ref=f2e25]:
            - listitem [ref=f2e26]: ExcelやCSVの内容を確認してから台帳へ登録
            - listitem [ref=f2e27]: 契約更新・未割当・要確認の項目を一覧で把握
            - listitem [ref=f2e28]: 削減候補額と、確認済みの削減実績を分けて記録
      - region [ref=f2e29]:
        - heading "今の管理表から、確認・見直しまで" [level=2] [ref=f2e30]
        - generic [ref=f2e31]:
          - article [ref=f2e32]:
            - heading "1. 今の管理表を活用" [level=3] [ref=f2e33]
            - paragraph [ref=f2e34]: 社員、端末、クラウドサービス、契約などの表から始められます。FreeはCSV/TXT、PremiumはXLSXとGoogle Sheetsに対応します。古いExcel形式（.xls）は使えません。
          - article [ref=f2e35]:
            - heading "2. 確認してから登録" [level=3] [ref=f2e36]
            - paragraph [ref=f2e37]: 取込前にプレビューし、列の対応と新規・更新・確認待ち・エラーを確認できます。AIの列候補も自動確定せず、担当者が確認して反映します。プレビューだけではデータは変わりません。
          - article [ref=f2e38]:
            - heading "3. 次の対応と費用を把握" [level=3] [ref=f2e39]
            - paragraph [ref=f2e40]: 契約更新、書類の期限、未割当の端末やサービスを確認。見直し候補額を確かめ、実際に削減できた金額は根拠とともに記録できます。
      - region [ref=f2e41]:
        - heading "IT運用の情報をまとめ、次の対応につなげる" [level=2] [ref=f2e42]
        - generic [ref=f2e43]:
          - article [ref=f2e44]:
            - heading "会社の台帳を一元管理" [level=3] [ref=f2e45]
            - paragraph [ref=f2e46]: 社員・部署、端末、クラウドサービス、契約と利用者の割当状況をまとめて確認できます。
          - article [ref=f2e47]:
            - heading "期限と確認漏れを見つける" [level=3] [ref=f2e48]
            - paragraph [ref=f2e49]: 契約の更新、書類の有効期限、セキュリティ確認、取引先の質問票など、対応が必要な項目を追えます。
          - article [ref=f2e50]:
            - heading "対応の根拠と結果を残す" [level=3] [ref=f2e51]
            - paragraph [ref=f2e52]: 取込履歴、確認済みの削減実績、週次サマリーや導入効果レポートで、状況を振り返れます。
        - paragraph [ref=f2e53]: 一部の取込形式・更新通知・セキュリティ機能・レポート・書き出し機能はPremiumで利用できます。
      - region [ref=f2e54]:
        - heading "自社のデータから、見直し候補額を試算" [level=2] [ref=f2e55]
        - paragraph [ref=f2e56]: 削減額は会社ごとに異なります。OpsDeckは登録された契約・クラウドサービス・端末の情報と設定条件をもとに、年間の見直し候補額を表示します。
        - generic [ref=f2e57]:
          - article [ref=f2e58]:
            - heading "更新が近い契約" [level=3] [ref=f2e59]
            - paragraph [ref=f2e60]: 対象となる契約の年額と会社ごとの見直し条件から、更新前に検討する金額の目安を表示します。
          - article [ref=f2e61]:
            - heading "利用者が割り当てられていないサービス" [level=3] [ref=f2e62]
            - paragraph [ref=f2e63]: 利用者の登録状況と継続契約の費用から、利用実態や契約条件を確認したいサービスを見つけます。
          - article [ref=f2e64]:
            - heading "使われていない可能性のある端末" [level=3] [ref=f2e65]
            - paragraph [ref=f2e66]: 割当状況や端末の状態から確認候補を表示し、会社で設定した月額目安をもとに費用を試算します。
        - paragraph [ref=f2e67]: 表示額は見直し候補の試算で、削減実績や削減保証ではありません。実際に見直せるかは利用状況や契約条件を担当者が確認してください。契約交渉・解約・サービス停止は自動で行わず、確認済みの削減実績は別に記録します。
      - region [ref=f2e68]:
        - heading "プラン" [level=2] [ref=f2e69]
        - generic [ref=f2e70]:
          - article [ref=f2e71]:
            - heading "Free" [level=3] [ref=f2e72]
            - paragraph [ref=f2e73]: 0円
            - list [ref=f2e74]:
              - listitem [ref=f2e75]: 社員20名・端末50台・SaaS10件まで
              - listitem [ref=f2e76]: CSV/TXTの実データ取込（登録上限まで）
              - listitem [ref=f2e77]: 基本ダッシュボード
              - listitem [ref=f2e78]: コスト集計
              - listitem [ref=f2e79]: 管理者1名
            - link "Freeで始める" [ref=f2e80] [cursor=pointer]:
              - /url: http://127.0.0.1:8007/register
          - article [ref=f2e81]:
            - heading "Premium" [level=3] [ref=f2e82]
            - paragraph [ref=f2e83]: 月額9,800円（税別）
            - list [ref=f2e84]:
              - listitem [ref=f2e85]: 社員200名・端末500台・SaaS100件まで
              - listitem [ref=f2e86]: CSV / XLSX / Google Sheets Import
              - listitem [ref=f2e87]: AI列マッピング候補（月500円相当まで）
              - listitem [ref=f2e88]: 削減可能額の概算・削減実績の記録・作業時間短縮の参考値
              - listitem [ref=f2e89]: 更新・セキュリティアラート
              - listitem [ref=f2e90]: 証跡・質問票・Export
              - listitem [ref=f2e91]: 導入効果レポート
              - listitem [ref=f2e92]: 管理者5名まで
            - link "登録後にPremiumを申し込む" [ref=f2e93] [cursor=pointer]:
              - /url: http://127.0.0.1:8007/register
        - paragraph [ref=f2e94]: 適用税額を加算し、申込前にStripe Checkoutでお支払い総額を表示します。削減候補額は入力情報と設定条件に基づく試算であり、実際の削減を保証するものではありません。
      - region [ref=f2e95]:
        - heading "OpsDeckがすること・しないこと" [level=2] [ref=f2e96]
        - paragraph [ref=f2e97]: OpsDeckはIT資産や契約を整理し、期限と対応状況を追うための運用台帳です。MDM／EDR、端末の遠隔操作、社内システムそのものの置き換えは提供しません。既存のExcel形式が分からない場合は、サンプルとプレビューから確認できます。
        - paragraph [ref=f2e98]:
          - link "サービスのFAQを見る" [ref=f2e99] [cursor=pointer]:
            - /url: http://127.0.0.1:8007/help
          - link "特定商取引法に基づく表記" [ref=f2e100] [cursor=pointer]:
            - /url: http://127.0.0.1:8007/commercial-transactions
