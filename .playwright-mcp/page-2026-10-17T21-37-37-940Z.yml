              - columnheader "月額" [ref=f5e76]
              - columnheader "登録上限" [ref=f5e77]
              - columnheader "主な機能" [ref=f5e78]
          - rowgroup [ref=f5e79]:
            - row [ref=f5e80]:
              - rowheader "Free" [ref=f5e81]
              - cell "無料" [ref=f5e82]
              - cell "社員20名・端末50台・クラウドサービス10件・管理者1名" [ref=f5e83]
