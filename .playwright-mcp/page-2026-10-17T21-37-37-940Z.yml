      - heading "使い方・よくある質問" [level=1] [ref=f5e8]
      - paragraph [ref=f5e9]: 管理表の取込や、社員・端末・クラウドサービスの管理方法を確認できます。
      - paragraph [ref=f5e10]:
        - link "FAQで解決しない場合はお問い合わせ" [ref=f5e11] [cursor=pointer]:
          - /url: http://127.0.0.1:8007/support
      - paragraph [ref=f5e12]:
        - text: メールでのお問い合わせ：
        - link "support@kimegami.jp" [ref=f5e13] [cursor=pointer]:
          - /url: mailto:support@kimegami.jp
      - navigation "ヘルプ内の目次" [ref=f5e14]:
        - list [ref=f5e15]:
          - listitem [ref=f5e16]:
