      - region [ref=f5e69]:
        - heading "無料プラン（Free）と有料プラン（Premium）の違い" [level=2] [ref=f5e70]
        - table "無料プランと有料プランの比較" [ref=f5e72]:
          - rowgroup [ref=f5e73]:
            - row [ref=f5e74]:
