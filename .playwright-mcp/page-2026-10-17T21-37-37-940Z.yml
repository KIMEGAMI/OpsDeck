              - cell [ref=f5e93]:
                - list [ref=f5e94]:
                  - listitem [ref=f5e95]: CSV / XLSX / Google Sheets Import
                  - listitem [ref=f5e96]: AI列マッピング候補（月500円相当まで）
                  - listitem [ref=f5e97]: 削減可能額の概算・削減実績の記録・作業時間短縮の参考値
                  - listitem [ref=f5e98]: 更新・セキュリティアラート
                  - listitem [ref=f5e99]: 証跡・質問票・Export
                  - listitem [ref=f5e100]: 導入効果レポート
        - paragraph [ref=f5e101]: Premiumの適用税額を含むお支払い総額は、申込前にStripe Checkoutで確認できます。
      - article [ref=f5e102]:
        - heading "OpsDeckは何を管理するサービスですか？" [level=2] [ref=f5e103]
        - paragraph [ref=f5e104]: 社員、IT資産、利用中のクラウドサービス、契約更新、証跡、セキュリティの確認項目を検索でき、期限と対応状況を確認するための管理サービスです。MDMやEDR、端末の遠隔操作を提供するものではありません。
      - article [ref=f5e105]:
        - heading "確認画面を見るだけで会社のデータは変わりますか？" [level=2] [ref=f5e106]
        - paragraph [ref=f5e107]: 変わりません。まず内容を確認し、取り込みを実行したときだけ会社のデータが登録・更新されます。元のExcelファイルと取込履歴は残ります。
      - article [ref=f5e108]:
        - heading "社内のExcel管理表はどう取り込めばよいですか？" [level=2] [ref=f5e109]
        - paragraph [ref=f5e110]: 元のExcelは変更せず、取り込むシートのコピーをCSV、またはPremiumプランで利用できるXLSXとして確認画面に進みます。CSVはExcelの表の内容を保存する形式で、UTF-8（BOM付き可）またはShift_JIS（Windows-31J）に対応しています。列名の行と、注記などがある場合はデータ開始行を指定し、画面に表示される列の対応と「新規・更新・確認待ち・エラー」を確認してください。確認画面を見るだけでは会社のデータは登録・更新されません。無料プラン（Free）でもCSV/TXTを取り込めます。社員・端末・SaaSサービスの登録数はFreeの上限までで、上限を超えた行はエラーとして確認できます。XLSX、Google Sheets、セキュリティ管理項目・証跡・質問票の取込はPremiumです。
      - article [ref=f5e111]:
        - heading "Excelファイルはどの形式で保存すればよいですか？" [level=2] [ref=f5e112]
        - paragraph [ref=f5e113]: CSVまたはTXTを取り込めます。有料プラン（Premium）ではXLSXも確認できます。旧形式のXLSファイルは対象外です。元ファイルを残したまま、対象シートをCSV（UTF-8またはShift_JIS）かXLSXで別保存してください。XLSXに複数シートがある場合は、データ取込時に対象シートを選択できます。保存後は確認画面で文字化け、日付・金額、列の対応を確認してください。
      - article [ref=f5e114]:
        - heading "AI補助を使うと、どのデータが外部へ送られますか？" [level=2] [ref=f5e115]
        - paragraph [ref=f5e116]: Premiumプランで組織のAI補助を有効にし、サーバー側の利用条件を満たす場合、列マッピング候補の取得時に列名、対象データ種別、OpsDeck側の候補項目を設定済みAIサービスへ送信します。取込データの行、ファイル全体、シート全体は送信しません。列名に含まれるメールアドレス・電話番号らしき値は伏せますが、氏名などは自動判定できないため、個人情報を含む列名は匿名化してから利用してください。FreeプランではAI候補を利用できないため送信しません。AIを使わず手動でマッピングすることもできます。
      - article [ref=f5e117]:
        - heading "AIの候補は自動承認されますか？" [level=2] [ref=f5e118]
        - paragraph [ref=f5e119]: AI候補は理由と信頼度を表示しますが、自動承認されません。人間が確認してから反映します。
      - article [ref=f5e120]:
        - heading "管理者のお知らせメールはどこから届きますか？" [level=2] [ref=f5e121]
        - paragraph [ref=f5e122]: 管理者のお知らせと週次サマリーは info@kimegami.jp から届きます。配信停止は週次サマリー画面で設定でき、運用上の問い合わせは support@kimegami.jp へご連絡ください。
      - article [ref=f5e123]:
        - heading "問い合わせ先はどこですか？" [level=2] [ref=f5e124]
        - paragraph [ref=f5e125]: 運用上の問い合わせは support@kimegami.jp へご連絡ください。証跡ファイルの内容やパスワード、トークンはメールに記載しないでください。