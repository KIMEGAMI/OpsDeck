      - region [ref=f3e67]:
        - heading "無料プラン（Free）と有料プラン（Premium）の違い" [level=2] [ref=f3e68]
        - table "無料プランと有料プランの比較" [ref=f3e70]:
          - rowgroup [ref=f3e71]:
            - row [ref=f3e72]:
              - columnheader "プラン" [ref=f3e73]
              - columnheader "月額" [ref=f3e74]
              - columnheader "登録上限" [ref=f3e75]
              - columnheader "主な機能" [ref=f3e76]
          - rowgroup [ref=f3e77]:
            - row [ref=f3e78]:
              - rowheader "Free" [ref=f3e79]
              - cell "無料" [ref=f3e80]
              - cell "社員20名・端末50台・クラウドサービス10件・管理者1名" [ref=f3e81]
              - cell [ref=f3e82]:
                - list [ref=f3e83]:
                  - listitem [ref=f3e84]: CSV/TXTの実データ取込（登録上限まで）
