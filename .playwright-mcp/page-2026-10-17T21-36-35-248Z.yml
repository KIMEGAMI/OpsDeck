              - cell "社員200名・端末500台・クラウドサービス100件・管理者5名" [ref=f3e90]
              - cell [ref=f3e91]:
                - list [ref=f3e92]:
                  - listitem [ref=f3e93]: CSV / XLSX / Google Sheets Import
                  - listitem [ref=f3e94]: AI列マッピング候補（月500円相当まで）
                  - listitem [ref=f3e95]: 削減可能額の概算・削減実績の記録・作業時間短縮の参考値
                  - listitem [ref=f3e96]: 更新・セキュリティアラート
                  - listitem [ref=f3e97]: 証跡・質問票・Export
                  - listitem [ref=f3e98]: 導入効果レポート
        - paragraph [ref=f3e99]: Premiumの適用税額を含むお支払い総額は、申込前にStripe Checkoutで確認できます。
      - article [ref=f3e100]:
        - heading "OpsDeckは何を管理するサービスですか？" [level=2] [ref=f3e101]
        - paragraph [ref=f3e102]: 社員、IT資産、利用中のクラウドサービス、契約更新、証跡、セキュリティの確認項目を検索でき、期限と対応状況を確認するための管理サービスです。MDMやEDR、端末の遠隔操作を提供するものではありません。
      - article [ref=f3e103]:
        - heading "確認画面を見るだけで会社のデータは変わりますか？" [level=2] [ref=f3e104]
        - paragraph [ref=f3e105]: 変わりません。まず内容を確認し、取り込みを実行したときだけ会社のデータが登録・更新されます。元のExcelファイルと取込履歴は残ります。
      - article [ref=f3e106]:
        - heading "社内のExcel管理表はどう取り込めばよいですか？" [level=2] [ref=f3e107]
        - paragraph [ref=f3e108]: 元のExcelは変更せず、取り込むシートのコピーをCSV、またはPremiumプランで利用できるXLSXとして確認画面に進みます。CSVはExcelの表の内容を保存する形式で、UTF-8（BOM付き可）またはShift_JIS（Windows-31J）に対応しています。列名の行と、注記などがある場合はデータ開始行を指定し、画面に表示される列の対応と「新規・更新・確認待ち・エラー」を確認してください。確認画面を見るだけでは会社のデータは登録・更新されません。無料プラン（Free）でもCSV/TXTを取り込めます。社員・端末・SaaSサービスの登録数はFreeの上限までで、上限を超えた行はエラーとして確認できます。XLSX、Google Sheets、セキュリティ管理項目・証跡・質問票の取込はPremiumです。
      - article [ref=f3e109]:
        - heading "Excelファイルはどの形式で保存すればよいですか？" [level=2] [ref=f3e110]
        - paragraph [ref=f3e111]: CSVまたはTXTを取り込めます。有料プラン（Premium）ではXLSXも確認できます。旧形式のXLSファイルは対象外です。元ファイルを残したまま、対象シートをCSV（UTF-8またはShift_JIS）かXLSXで別保存してください。XLSXに複数シートがある場合は、データ取込時に対象シートを選択できます。保存後は確認画面で文字化け、日付・金額、列の対応を確認してください。
      - article [ref=f3e112]:
        - heading "AI補助を使うと、どのデータが外部へ送られますか？" [level=2] [ref=f3e113]
        - paragraph [ref=f3e114]: Premiumプランで組織のAI補助を有効にし、サーバー側の利用条件を満たす場合、列マッピング候補の取得時に列名、対象データ種別、OpsDeck側の候補項目を設定済みAIサービスへ送信します。取込データの行、ファイル全体、シート全体は送信しません。列名に含まれるメールアドレス・電話番号らしき値は伏せますが、氏名などは自動判定できないため、個人情報を含む列名は匿名化してから利用してください。FreeプランではAI候補を利用できないため送信しません。AIを使わず手動でマッピングすることもできます。
      - article [ref=f3e115]:
        - heading "AIの候補は自動承認されますか？" [level=2] [ref=f3e116]
        - paragraph [ref=f3e117]: AI候補は理由と信頼度を表示しますが、自動承認されません。人間が確認してから反映します。
      - article [ref=f3e118]:
        - heading "管理者のお知らせメールはどこから届きますか？" [level=2] [ref=f3e119]
        - paragraph [ref=f3e120]: 管理者のお知らせと週次サマリーは info@kimegami.jp から届きます。配信停止は週次サマリー画面で設定でき、運用上の問い合わせは support@kimegami.jp へご連絡ください。
      - article [ref=f3e121]:
        - heading "問い合わせ先はどこですか？" [level=2] [ref=f3e122]
        - paragraph [ref=f3e123]: 運用上の問い合わせは support@kimegami.jp へご連絡ください。証跡ファイルの内容やパスワード、トークンはメールに記載しないでください。