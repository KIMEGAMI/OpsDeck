      - heading "使い方・よくある質問" [level=1] [ref=f3e8]
      - paragraph [ref=f3e9]: 管理表の取込や、社員・端末・クラウドサービスの管理方法を確認できます。
      - paragraph [ref=f3e10]:
        - link "FAQで解決しない場合はお問い合わせ" [ref=f3e11] [cursor=pointer]:
          - /url: http://127.0.0.1:8007/support
      - paragraph [ref=f3e12]:
        - text: メールでのお問い合わせ：
        - link "support@kimegami.jp" [ref=f3e13] [cursor=pointer]:
          - /url: mailto:support@kimegami.jp
      - navigation "ヘルプ内の目次" [ref=f3e14]:
        - list [ref=f3e15]:
